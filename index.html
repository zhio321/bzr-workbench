<title>初中班主任工作台</title>
<style>
  :root{
    /* 字体 */
    --font-sans:'SF Pro Display','Geist Sans','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
    --font-serif:'Newsreader','Noto Serif SC','Songti SC','STSong',Georgia,serif;
    --font-mono:'SF Mono','Geist Mono','JetBrains Mono',ui-monospace,monospace;
    /* 形状 / 圆角 */
    --r-card:12px; --r-input:8px; --r-btn:6px; --r-modal:14px; --r-pill:999px;
    --glass:0%; /* 界面透明度：0%=完全不透明，越大越通透（仅在有背景图时可见效果） */
    /* Notion（默认·暖色极简·衬线标题） */
    --bg:#FFFFFF; --panel:#F7F6F3; --ink:#37352F; --muted:#787066; --line:#ECEAE6;
    --brand:#2E6F9E; --brand-soft:#E7F1F7; --ok:#3A7D44; --warn:#9A6A00; --bad:#B23A3A;
    --chip:#EFEDEA; --shadow:0 1px 2px rgba(55,53,47,.05);
    --scrim:rgba(247,246,243,.55);
    --font-head:var(--font-serif);
    --p-blue:#E7F1F7; --p-blue-t:#2E6F9E;
    --p-green:#E9F2EA; --p-green-t:#3A7D44;
    --p-yellow:#FBF1D6; --p-yellow-t:#9A6A00;
    --p-red:#FBE9E9; --p-red-t:#B23A3A;
  }
  /* Linear — 极简·紫色 */
  [data-theme="linear"]{
    --bg:#FFFFFF; --panel:#FBFBFC; --ink:#1C1D21; --muted:#6B6F76; --line:#EDEEF0;
    --brand:#5E6AD2; --brand-soft:#EEF0FB; --ok:#3A7D44; --warn:#9A6A00; --bad:#D6455B;
    --chip:#F2F2F4; --shadow:0 1px 2px rgba(28,29,33,.04);
    --scrim:rgba(251,251,252,.5); --font-head:var(--font-sans);
    --p-blue:#EEF0FB; --p-blue-t:#5E6AD2;
    --p-green:#E7F4EA; --p-green-t:#3A7D44;
    --p-yellow:#FBF1D6; --p-yellow-t:#9A6A00;
    --p-red:#FCE8EC; --p-red-t:#D6455B;
  }
  /* Superhuman — 暗色·紫辉 */
  [data-theme="superhuman"]{
    --bg:#0E0E12; --panel:#16161C; --ink:#ECECF1; --muted:#9A9AA8; --line:#26262F;
    --brand:#8B5CF6; --brand-soft:#231B33; --ok:#5BBF6A; --warn:#D9A441; --bad:#EF6E7B;
    --chip:#1E1E26; --shadow:0 2px 10px rgba(0,0,0,.5);
    --scrim:rgba(8,8,12,.55); --font-head:var(--font-sans);
    --p-blue:#1E2A3A; --p-blue-t:#9CB6E6;
    --p-green:#1A2A1E; --p-green-t:#7FCF8A;
    --p-yellow:#2A2418; --p-yellow-t:#E0BE7A;
    --p-red:#2A1E1E; --p-red-t:#EF8B95;
  }
  /* Apple — 留白·蓝 */
  [data-theme="apple"]{
    --bg:#FFFFFF; --panel:#F5F5F7; --ink:#1D1D1F; --muted:#86868B; --line:#D2D2D7;
    --brand:#0071E3; --brand-soft:#E8F1FD; --ok:#34805A; --warn:#9A6A00; --bad:#D6453F;
    --chip:#ECECEE; --shadow:0 1px 3px rgba(0,0,0,.06);
    --scrim:rgba(245,245,247,.5); --font-head:var(--font-sans);
    --p-blue:#E8F1FD; --p-blue-t:#0071E3;
    --p-green:#E6F4EC; --p-green-t:#34805A;
    --p-yellow:#FBF1D6; --p-yellow-t:#9A6A00;
    --p-red:#FCE9E8; --p-red-t:#D6453F;
  }
  /* Cal.com — 中性·极简 */
  [data-theme="cal"]{
    --bg:#FFFFFF; --panel:#FAFAFA; --ink:#18181B; --muted:#71717A; --line:#E4E4E7;
    --brand:#18181B; --brand-soft:#F4F4F5; --ok:#3A7D44; --warn:#9A6A00; --bad:#DC2626;
    --chip:#F4F4F5; --shadow:0 1px 2px rgba(24,24,27,.04);
    --scrim:rgba(250,250,250,.5); --font-head:var(--font-sans);
    --p-blue:#F1F5F9; --p-blue-t:#2563EB;
    --p-green:#F0FDF4; --p-green-t:#16A34A;
    --p-yellow:#FEFCE8; --p-yellow-t:#A16207;
    --p-red:#FEF2F2; --p-red-t:#DC2626;
  }
  /* Airbnb — 暖珊瑚·圆润 */
  [data-theme="airbnb"]{
    --bg:#FFFFFF; --panel:#FFF8F5; --ink:#222222; --muted:#717171; --line:#DDDDDD;
    --brand:#FF385C; --brand-soft:#FFE9EE; --ok:#3A7D44; --warn:#B26A00; --bad:#C1352B;
    --chip:#FFF1EC; --shadow:0 2px 8px rgba(0,0,0,.06);
    --scrim:rgba(255,248,245,.5); --font-head:var(--font-sans);
    --r-card:16px; --r-btn:10px; --r-pill:999px;
    --p-blue:#E9F2FB; --p-blue-t:#1A73C2;
    --p-green:#EAF5EC; --p-green-t:#3A7D44;
    --p-yellow:#FEF3D7; --p-yellow-t:#B26A00;
    --p-red:#FFE9EE; --p-red-t:#C1352B;
  }
  /* Vercel — 暗黑·精准 */
  [data-theme="vercel"]{
    --bg:#000000; --panel:#0A0A0A; --ink:#FAFAFA; --muted:#A1A1A1; --line:#1F1F1F;
    --brand:#FFFFFF; --brand-soft:#1A1A1A; --ok:#50E3C2; --warn:#F5A623; --bad:#FF4D4D;
    --chip:#161616; --shadow:0 2px 8px rgba(0,0,0,.6);
    --scrim:rgba(0,0,0,.6); --font-head:var(--font-sans);
    --r-card:8px; --r-btn:4px;
    --p-blue:#0E1A2A; --p-blue-t:#7AB7FF;
    --p-green:#0E2A18; --p-green-t:#6FE3A0;
    --p-yellow:#2A2410; --p-yellow-t:#F5C95B;
    --p-red:#2A1010; --p-red-t:#FF7A7A;
  }
  /* IBM Carbon — 结构蓝 */
  [data-theme="carbon"]{
    --bg:#FFFFFF; --panel:#F4F4F4; --ink:#161616; --muted:#525252; --line:#E0E0E0;
    --brand:#0F62FE; --brand-soft:#EDF2FF; --ok:#24A148; --warn:#FEBD11; --bad:#DA1E28;
    --chip:#E8E8E8; --shadow:0 1px 2px rgba(0,0,0,.06);
    --scrim:rgba(244,244,244,.5); --font-head:var(--font-sans);
    --r-card:4px; --r-btn:2px;
    --p-blue:#EDF2FF; --p-blue-t:#0F62FE;
    --p-green:#E5F5EC; --p-green-t:#24A148;
    --p-yellow:#FEF3D1; --p-yellow-t:#8A6D00;
    --p-red:#FCE9EA; --p-red-t:#DA1E28;
  }
  /* Stripe — 紫渐变·优雅 */
  [data-theme="stripe"]{
    --bg:#FFFFFF; --panel:#FBFAFE; --ink:#1A1F36; --muted:#697386; --line:#E6E6E6;
    --brand:#635BFF; --brand-soft:#EEEAFF; --ok:#15803D; --warn:#B26A00; --bad:#DF1B41;
    --chip:#F1EFFE; --shadow:0 1px 3px rgba(26,31,54,.05);
    --scrim:rgba(251,250,254,.5); --font-head:var(--font-sans);
    --p-blue:#EEEAFF; --p-blue-t:#635BFF;
    --p-green:#E7F4EC; --p-green-t:#15803D;
    --p-yellow:#FBF3D6; --p-yellow-t:#B26A00;
    --p-red:#FCE9EC; --p-red-t:#DF1B41;
  }
  /* Figma — 活力橙红 */
  [data-theme="figma"]{
    --bg:#FFFFFF; --panel:#FFFDFB; --ink:#1E1E1E; --muted:#6B6B6B; --line:#ECECEC;
    --brand:#F24E1E; --brand-soft:#FFEDE6; --ok:#3A7D44; --warn:#B26A00; --bad:#D6453F;
    --chip:#FFF1EB; --shadow:0 2px 8px rgba(0,0,0,.05);
    --scrim:rgba(255,253,251,.5); --font-head:var(--font-sans);
    --r-card:14px;
    --p-blue:#E9F2FB; --p-blue-t:#1A73C2;
    --p-green:#EAF5EC; --p-green-t:#3A7D44;
    --p-yellow:#FEF3D7; --p-yellow-t:#B26A00;
    --p-red:#FFEDE6; --p-red-t:#D6453F;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  .app{display:flex;min-height:100vh}
  /* sidebar */
  .side{width:208px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
  .logo{font-weight:800;font-size:16px;color:var(--brand);padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
  .logo .dot{width:10px;height:10px;border-radius:3px;background:var(--brand)}
  .navbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:2px}
  .navbtn:hover{background:var(--bg)}
  .navbtn.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
  .navbtn .ic{width:18px;text-align:center}
  .navbtn svg{width:18px;height:18px;flex:none}
  .navbtn .kbd{margin-left:auto;font-size:10px;line-height:1;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:3px 5px;opacity:.7}
  .navbtn.active .kbd{color:var(--brand);border-color:var(--brand-soft)}
  .side .foot{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  /* main */
  .main{flex:1;padding:22px 28px;max-width:1180px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .topbar h1{font-size:20px;margin:0;display:inline-flex;align-items:center;width:fit-content;padding:6px 14px;border-radius:8px;background:var(--brand-soft);border-left:4px solid var(--brand)}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  button.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:var(--r-btn);cursor:pointer;font-size:13px;transition:border-color .15s ease,color .15s ease,background .15s ease,transform .08s ease}
  button.btn:hover{border-color:var(--brand);color:var(--brand)}
  button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.btn.primary:hover{filter:brightness(1.05);color:#fff}
  button.btn:active{transform:translateY(1px)}
  button.btn.ghost{background:transparent}
  button.btn.sm{padding:5px 10px;font-size:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease}
  .card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px;width:fit-content;padding:6px 12px;border-radius:8px;border-left:4px solid var(--brand)}
  .grid{display:grid;gap:14px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .stat .n{font-size:26px;font-weight:800;color:var(--brand)}
  .stat .l{color:var(--muted);font-size:13px;margin-top:4px}
  .clock-card{display:block}
  .clock-card .clock{color:#fff;font-size:24px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .sch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
  .sch-row:last-child{border-bottom:none}
  .sch-time{flex:0 0 auto;min-width:140px}
  .sch-info{flex:1;text-align:right}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0;z-index:3;backdrop-filter:blur(6px);box-shadow:0 1px 0 var(--line)}
  tr:hover td{background:#fafcff}
  .tag{display:inline-block;background:var(--chip);color:var(--brand);border-radius:var(--r-pill);padding:1px 9px;font-size:12px;margin:1px 3px 1px 0}
  .tag.r{background:#fef2f2;color:#b91c1c}
  .pill{display:inline-block;padding:2px 9px;border-radius:var(--r-pill);font-size:12px}
  .pill.ok{background:#f0fdf4;color:#15803d}
  .pill.warn{background:#fffbeb;color:#b45309}
  .pill.bad{background:#fef2f2;color:#b91c1c}
  .pill.late{background:#fef3c7;color:#92400e}
  .pill.leave{background:#eff6ff;color:#1d4ed8}
  input,select,textarea{font-family:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-input);width:100%;background:var(--panel);color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease}
  textarea{resize:vertical;min-height:64px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .field{flex:1;min-width:120px}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border-radius:var(--r-modal);width:min(620px,100%);padding:22px;box-shadow:var(--shadow);animation:modalIn .22s cubic-bezier(.16,1,.3,1) both}
  @keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .modal.tall{height:75vh;max-height:75vh;display:flex;flex-direction:column;overflow-y:auto}
  .modal.tall h3{flex:0 0 auto}
  .modal.tall p{flex:0 0 auto}
  .modal.tall textarea{flex:1 1 auto;min-height:0;height:auto}
  /* Toast 轻量反馈（替代原生 alert/confirm 删除提示） */
  #toastWrap{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:10px;max-width:min(360px,calc(100vw - 36px));pointer-events:none}
  .toast{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:11px 14px;box-shadow:0 6px 22px rgba(0,0,0,.16);font-size:13.5px;color:var(--ink);animation:toastIn .25s cubic-bezier(.16,1,.3,1) both;pointer-events:auto}
  .toast.ok{border-left-color:var(--ok)}
  .toast.bad{border-left-color:var(--bad)}
  .toast.warn{border-left-color:var(--warn)}
  .toast .tx{flex:1 1 auto;line-height:1.4}
  .toast .tact{flex:0 0 auto;border:none;background:transparent;color:var(--brand);font-weight:700;cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
  .toast .tact:hover{background:var(--chip)}
  .toast.hide{animation:toastOut .25s ease forwards}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
  @keyframes toastOut{to{opacity:0;transform:translateX(20px)}}
  .modal input[type=range]{accent-color:var(--brand)}
  .modal h3{margin:0 0 16px;font-size:16px}
  .search{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .search input{max-width:280px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  /* 愉悦空状态：插图 + 引导文案 + 行动按钮 */
  .emptyCard{text-align:center;padding:44px 18px;animation:fadeUp .4s cubic-bezier(.16,1,.3,1) both}
  .emptyCard .empty-ic{width:56px;height:56px;margin:0 auto 14px;color:var(--brand);opacity:.85}
  .emptyCard .empty-ic svg{width:56px;height:56px;display:block}
  .emptyCard .empty-t{font-size:15px;font-weight:600;color:var(--ink);font-family:var(--font-head);letter-spacing:-.01em}
  .emptyCard .empty-d{color:var(--muted);font-size:13px;margin:6px auto 18px;max-width:380px;line-height:1.6}
  .muted{color:var(--muted)}
  .flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .spread{justify-content:space-between}
  /* schedule grid */
  .sched{display:grid;gap:6px}
  .sched .cell{border:1px solid var(--line);border-radius:var(--r-input);padding:6px;min-height:48px;font-size:12px;cursor:text;transition:border-color .15s ease,background .15s ease}
  .sched .cell.head{background:var(--brand-soft);color:var(--brand);font-weight:700;cursor:default;text-align:center}
  .sched .cell .sb{font-weight:700}
  .sched .cell .cl{color:var(--brand);font-size:12px;font-weight:600;line-height:1.4}
  .cl{color:var(--brand);font-size:12px;font-weight:600;background:#eff6ff;padding:1px 7px;border-radius:999px;line-height:1.4}
  .sched .cell .tc{color:var(--muted)}
  .sched .cell.tmp{background:#fff7ed;border-color:#fed7aa}
  .sched .cell.head .sb{font-size:12px}
  button.btn:disabled{opacity:.45;cursor:not-allowed}
  .period-row .field{margin-bottom:0}
  /* charts */
  .bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
  .bar .lab{width:90px;color:var(--muted)}
  .bar .track{flex:1;background:var(--bg);border-radius:6px;height:14px;overflow:hidden}
  .bar .fill{height:100%;background:var(--brand)}
  .linechart{width:100%;max-width:560px}
  /* tooltip/misc */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden}
  .seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
  .seg button.on{background:var(--brand);color:#fff}
  .scrollx{overflow-x:auto}
  .kv{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  a.lnk{color:var(--brand);cursor:pointer;text-decoration:none}
  a.lnk:hover{text-decoration:underline}
  .danger{color:var(--bad)}
  /* 导入模板 */
  .tpl-box{border:1px solid var(--line);border-radius:var(--r-card);padding:14px 14px 12px;background:var(--bg);margin:6px 0 4px}
  .tpl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .tpl-head span{font-size:13px;font-weight:600;color:var(--ink)}
  /* ============ 极简编辑风重写 ============ */
  /* 侧边栏 */
  .side{width:232px;background:var(--panel);border-right:1px solid var(--line);padding:24px 16px}
  .logo{font-family:var(--font-head);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--ink);padding:4px 12px 20px;display:flex;align-items:center;gap:9px}
  .logo .dot{width:9px;height:9px;border-radius:3px;background:var(--brand)}
  .navbtn{border-radius:var(--r-btn);font-size:14px;padding:9px 12px;color:var(--muted)}
  .navbtn:hover{background:var(--chip)}
  .navbtn.active{background:var(--chip);color:var(--ink);font-weight:600}
  .navbtn.active::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--ink)}
  .foot{border-top:1px solid var(--line);margin-top:20px;padding-top:14px}
  .theme-row{margin:8px 0 4px}
  .theme-open{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-btn);padding:10px 12px;cursor:pointer;font-size:14px;color:var(--ink)}
  .theme-open:hover{border-color:var(--ink)}
  .theme-open .sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);flex:none}

  /* 主区 */
  .main{padding:34px 42px;max-width:1180px}
  .topbar{margin-bottom:24px;flex-wrap:wrap;gap:12px}
  .topbar h1{font-family:var(--font-head);font-weight:600;font-size:27px;letter-spacing:-.02em;line-height:1.15}
  .topbar .sub{font-family:var(--font-mono);font-size:12px;letter-spacing:.01em}

  /* 卡片 */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:22px;box-shadow:var(--shadow);margin-bottom:16px;animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both}

<script>
/* ============ 数据层 ============ */
const K='wb_banzhuren_v1';
/* ============ 主题 ============ */
const THEMES=[
 {id:'notion',name:'Notion',desc:'暖色极简·衬线'},
 {id:'linear',name:'Linear',desc:'极简·紫色'},
 {id:'superhuman',name:'Superhuman',desc:'暗色·紫辉'},
 {id:'apple',name:'Apple',desc:'留白·蓝'},
 {id:'cal',name:'Cal.com',desc:'中性·极简'},
 {id:'airbnb',name:'Airbnb',desc:'暖珊瑚·圆润'},
 {id:'vercel',name:'Vercel',desc:'暗黑·精准'},
 {id:'carbon',name:'IBM Carbon',desc:'结构蓝'},
 {id:'stripe',name:'Stripe',desc:'紫渐变·优雅'},
 {id:'figma',name:'Figma',desc:'活力橙红'}
];

let curTheme='notion';
try{const t=localStorage.getItem('wb_theme');if(t&&THEMES.some(x=>x.id===t))curTheme=t;}catch(e){}
function applyTheme(id){if(!THEMES.some(x=>x.id===id))return;curTheme=id;document.documentElement.setAttribute('data-theme',id);try{localStorage.setItem('wb_theme',id);}catch(e){}applyBg();renderThemes();}
function renderThemes(){const box=$('#themeRow');if(!box)return;box.innerHTML=`<button class="theme-open" data-act="theme"><span class="sw" style="background:${THEME_COLORS[curTheme]}"></span>更换主题</button>`;box.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.arg));}

try{curBg=localStorage.getItem('wb_bg')||'';}catch(e){}

try{curScrim=localStorage.getItem('wb_scrim')!=='0';}catch(e){}
let curGlass=0;
try{curGlass=parseInt(localStorage.getItem('wb_glass')||'0',10)||0;}catch(e){}
function applyGlass(){document.documentElement.style.setProperty('--glass',curGlass+'%');}
function applyBg(){
  const scrim=document.getElementById('bgScrim'),overlay=document.getElementById('bgOverlay');
  if(!scrim||!overlay)return;
  if(curBg){scrim.style.backgroundImage='url('+curBg+')';scrim.style.display='block';}else{scrim.style.backgroundImage='';scrim.style.display='none';}
  const sc=getComputedStyle(document.documentElement).getPropertyValue('--scrim').trim();
  overlay.style.background=sc||'rgba(250,250,249,.55)';
  overlay.style.display=(curBg&&curScrim)?'block':'none';
}
function onBgFile(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const maxW=1280;let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);let data;try{data=cv.toDataURL('image/jpeg',0.8);}catch(err){data=r.result;}curBg=data;try{localStorage.setItem('wb_bg',data);}catch(err){toast('图片过大，存储失败，请换一张较小的图',{type:'bad'});return;}applyBg();act('theme');};img.onerror=()=>toast('图片读取失败',{type:'bad'});img.src=r.result;};
  r.readAsDataURL(f);
}
const DEFAULT_PERIODS=[
  {id:'p1',name:'第1节',time:'8:00-8:40'},

];

const DEFAULT_SCHEDULE_GRID={};

let S;
/* seedDemo 已停用：工作台不再预置示例数据，首次打开即为空白 */

function migrateSchedule(){
  const sc=S.schedule||{};
  // 旧数据：periods 是数字，迁移为完整默认作息（不再截断），并迁移 grid 数字键
  if(typeof sc.periods==='number'){
    const oldP=sc.periods;
    sc.periods=JSON.parse(JSON.stringify(DEFAULT_PERIODS));
    // 若旧节数超过默认（极端情况），补齐占位节次
    for(let i=sc.periods.length+1;i<=oldP;i++) sc.periods.push({id:'p'+i,name:'第'+i+'节',time:''});
    const newGrid={};
    Object.keys(sc.grid||{}).forEach(d=>{
      newGrid[d]={};
      Object.keys(sc.grid[d]).forEach(k=>{
        const id='p'+k;
        if(sc.periods.find(p=>p.id===id)) newGrid[d][id]=sc.grid[d][k];
      });
    });
    sc.grid=newGrid;
  } else if(Array.isArray(sc.periods)){
    // 兼容：曾被旧版迁移截断为 p1..pN（id 连续且数量小于完整默认），补齐缺失的默认时段
    const ids=sc.periods.map(p=>p.id);
    const sequentialDefault=ids.length>0 && ids.every((id,i)=>id==='p'+(i+1));
    if(sequentialDefault && sc.periods.length<DEFAULT_PERIODS.length){
      const have=new Set(ids);
      DEFAULT_PERIODS.forEach(dp=>{ if(!have.has(dp.id)) sc.periods.push(JSON.parse(JSON.stringify(dp))); });
      sc.periods.sort((a,b)=>parseInt(a.id.slice(1))-parseInt(b.id.slice(1)));
    }
  }
  // 兜底：若没有 periods 或为空，写入默认
  if(!Array.isArray(sc.periods)||!sc.periods.length) sc.periods=JSON.parse(JSON.stringify(DEFAULT_PERIODS));
  S.schedule=sc;
}
function migrateClass(){
  // 旧数据可能没有独立的 grade/cla 字段，从 className 反推，保证兼容
  if(typeof S.cla!=='string'||!S.cla){
    const m=S.className&&S.className.match(/\(([^)]+)\)/);
    S.cla=m?m[1]:'C6';
  }
  if(typeof S.grade!=='string'||!S.grade){
    S.grade=S.className?S.className.split('(')[0].replace(/班$/,''):'初一';
  }
  if(!S.className) S.className=S.grade+'('+S.cla+')班';
  // 旧版硬编码默认「初一(1)班」(从未手动改过) 统一改为 C6，对齐新默认值
  if(S.className==='初一(1)班' && S.grade==='初一'){ S.cla='C6'; S.className='初一(C6)班'; }
}

function readFileAsRows(file, cb){
  const name=(file.name||'').toLowerCase();
  if(name.endsWith('.csv')){
    const r=new FileReader();
    r.onload=()=>cb(null, csvToRows(String(r.result)));
    r.onerror=()=>cb('文件读取失败');
    r.readAsText(file,'utf-8');
    return;
  }
  if(typeof XLSX==='undefined'){ cb('需要联网加载 Excel 解析组件，请连网后重试，或改用 .csv 格式文件。'); return; }
  const r=new FileReader();
  r.onload=()=>{ try{ const wb=XLSX.read(new Uint8Array(r.result),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}); cb(null, rows.map(row=>row.map(c=>c==null?'':String(c).trim()))); }catch(e){ cb('Excel 解析失败：'+e.message); } };
  r.onerror=()=>cb('文件读取失败');
  r.readAsArrayBuffer(file);
}

function csvToRows(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(ch!=='\r')cur+=ch; }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

const WEEK_MAP={'1':'周一','壹':'周一','2':'周二','二':'周二','3':'周三','叁':'周三','4':'周四','四':'周四','5':'周五','伍':'周五','6':'周六','六':'周六','7':'周日','日':'周日','天':'周日'};
function dayKey(t){ t=String(t||'').trim();
  const m=t.match(/周([一二三四五六日天])|星期([一二三四五六日天])/); if(m)return '周'+(m[1]||m[2]);
  const m2=t.match(/([0-9])|([壹贰叁肆伍陆柒])/); if(m2)return WEEK_MAP[m2[1]||m2[2]]||'';
  if(/^mon/i.test(t))return'周一'; if(/^tue/i.test(t))return'周二'; if(/^wed/i.test(t))return'周三'; if(/^thu/i.test(t))return'周四'; if(/^fri/i.test(t))return'周五'; if(/^sat/i.test(t))return'周六'; if(/^sun/i.test(t))return'周日';
  return '';
}
function parseCell(text){
  text=String(text||'').trim(); if(!text)return null;
  if(/班$/.test(text)||/^c\d+$/i.test(text))return {cls:text,subject:'',teacher:''};
  const m=text.match(/^(.*?)[（(](.+?)[)）]$/);
  if(m)return {subject:m[1].trim(),cls:'',teacher:m[2].trim()};
  return {subject:text,cls:'',teacher:''};
}
function buildSchGrid(rows){
  if(!rows||!rows.length)return null;
  let hr=0; for(let i=0;i<Math.min(rows.length,3);i++){ if(rows[i].some(c=>dayKey(c))){hr=i;break;} }
  const headers=rows[hr]||[];
  const dayCols=[]; headers.forEach((h,c)=>{const d=dayKey(h); if(d&&S.schedule.days.includes(d))dayCols.push([c,d]);});
  if(!dayCols.length)return null;
  const periods=S.schedule.periods; const grid={};
  for(let r=hr+1;r<rows.length;r++){
    const p=periods[r-hr-1]; if(!p)break;
    dayCols.forEach(([c,d])=>{ const cell=parseCell(rows[r][c]); if(!cell)return; grid[d]=grid[d]||{}; grid[d][p.id]=cell; });
  }
  return grid;
}
function renderSchPreview(){
  const area=$('#schPreview'); if(!area)return;
  if(!_schGrid){area.innerHTML='';return;}
  const days=S.schedule.days.filter(d=>_schGrid[d]&&Object.keys(_schGrid[d]).length);

  if(!periods.length){area.innerHTML='<p class="muted">未识别到课表内容，请检查文件：首行应为星期、首列应为节次。</p>';return;}
  let h='<table><thead><tr><th>节次</th>'+days.map(d=>`<th>${d}</th>`).join('')+'</tr></thead><tbody>';
  periods.forEach(p=>{ h+=`<tr><td>${esc(p.name)}</td>`+days.map(d=>{const c=_schGrid[d][p.id]; return `<td>${c?esc((c.subject||c.cls||'')+(c.teacher?'('+c.teacher+')':'')):''}</td>`;}).join('')+'</tr>'; });
  h+='</tbody></table>';
  area.innerHTML=h;
}

/* ============ 轻量提示 Toast（替代原生 alert / 删除确认） ============ */
function toast(msg,opts){
  opts=opts||{};
  const wrap=$('#toastWrap');
  const el=document.createElement('div');
  el.className='toast'+(opts.type?(' '+opts.type):'');
  const tx=document.createElement('span');tx.className='tx';tx.innerHTML=msg;
  el.appendChild(tx);
  let timer=null;
  const dismiss=()=>{if(!el.isConnected)return;el.classList.add('hide');setTimeout(()=>el.remove(),240);};
  if(opts.action){
    const b=document.createElement('button');b.className='tact';b.textContent=opts.action;
    b.onclick=()=>{if(opts.onClick)opts.onClick();dismiss();};
    el.appendChild(b);
  }
  wrap.appendChild(el);
  const dur=opts.duration!=null?opts.duration:2600;
  if(dur>0)timer=setTimeout(dismiss,dur);
  return {el,dismiss};
}

    <td><b>${esc(s.name)}</b></td>
    <td>${s.gender==='女'?'女':'男'}</td>
    <td>${esc(s.studentNo||'')}</td>
    <td>第${esc(s.seat||'-')}座</td>
    <td>${(s.roles||[]).map(r=>`<span class="tag r">${esc(r)}</span>`).join('')||'-'}</td>
    <td>${(s.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')||'-'}</td>
    <td class="kv">${(s.parents||[]).map(p=>`${esc(p.relation||'家长')}:${esc(p.phone||'-')}`).join(' / ')||'-'}</td>
    <td><a class="lnk" data-act="editStudent" data-arg="${s.id}">编辑</a> <a class="lnk danger" data-act="delStudent" data-arg="${s.id}">删</a></td>
  </tr>`).join('');
  const tb=list.length?`<table><thead><tr><th>姓名</th><th>性别</th><th>学号</th><th>座位</th><th>班干部</th><th>标签</th><th>家长联系</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`:emptyCard('还没有学生档案','添加第一位学生，或从 Excel / CSV 批量导入，快速建好全班名册。',{act:'addStudent',label:'+ 添加学生'});
  return `<div class="topbar"><div><h1>学生档案</h1><div class="sub">共 ${S.students.length} 人</div></div>
    <div class="btns"><button class="btn primary" data-act="addStudent">+ 添加学生</button><button class="btn" data-act="importStudents">批量导入</button></div></div>
    <div class="card"><div class="search"><input id="q" placeholder="搜索姓名 / 学号 / 标签" value="${esc(q)}"><button class="btn" data-act="reload">搜索</button></div>${tb}</div>`;
}
function studentForm(s){
  s=s||{};
  const parents=(s.parents||[{name:'',relation:'父亲',phone:'',wechat:''}]);
  const pRows=parents.map((p,i)=>`<div class="row" data-prow="${i}">
    <div class="field"><label>关系</label><input data-p="relation" value="${esc(p.relation||'')}"></div>
    <div class="field"><label>姓名</label><input data-p="name" value="${esc(p.name||'')}"></div>
    <div class="field"><label>电话</label><input data-p="phone" value="${esc(p.phone||'')}"></div>
    <div class="field"><label>微信</label><input data-p="wechat" value="${esc(p.wechat||'')}"></div>
    <button class="btn sm" data-act="delParent" data-arg="${i}">×</button></div>`).join('');
  return `<h3>${s.id?'编辑学生':'添加学生'}</h3>
   <div class="row"><div class="field"><label>姓名 *</label><input id="f_name" value="${esc(s.name||'')}"></div>
     <div class="field"><label>性别</label><select id="f_gender"><option ${s.gender==='男'?'selected':''}>男</option><option ${s.gender==='女'?'selected':''}>女</option></select></div>
     <div class="field"><label>学号</label><input id="f_no" value="${esc(s.studentNo||'')}"></div>
     <div class="field"><label>座位号</label><input id="f_seat" value="${esc(s.seat||'')}"></div></div>
   <div class="row"><div class="field"><label>出生日期</label><input id="f_birth" type="date" value="${esc(s.birthday||'')}"></div>
     <div class="field"><label>班干部/课代表(逗号分隔)</label><input id="f_roles" value="${esc((s.roles||[]).join(','))}"></div>
     <div class="field"><label>标签(逗号分隔)</label><input id="f_tags" value="${esc((s.tags||[]).join(','))}" placeholder="学困/留守/特长…"></div></div>
   <div class="field"><label>家长联系方式</label><div id="pbox">${pRows}</div><button class="btn sm" data-act="addParent">+ 再加一位家长</button></div>
   <div class="field"><label>备注</label><textarea id="f_note">${esc(s.note||'')}</textarea></div>
   <div class="flex spread" style="margin-top:8px"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="saveStudent" data-arg="${s.id||''}">保存</button></div>`;
}
function act(a,arg){
  if(a==='go'){nav(arg);return;}
  if(a==='close'){closeModal();return;}
  if(a==='reload'){render();return;}
  /* 手机遥控 */
  if(a==='push:cfg'){ensurePushLib();openModal(pushConfigForm());return;}
  if(a==='push:saveCfg'){
    const code=($('#pc_code').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
    const srv=($('#pc_srv').value||'').trim().replace(/\/+$/,'')||'https://ntfy.sh';
    S.boardPush={code,server:srv,key:($('#pc_key').value||'').trim(),crypt:$('#pc_cr').value==='1'?1:0,on:$('#pc_on').checked?1:0};
    save();closeModal();render();toast('配对设置已保存',{type:'ok'});return;
  }
  if(a==='push:gen'){
    ensurePushLib();
    const np=Object.assign(boardPush(),{code:genPushCode()});
    S.boardPush=np;save();render();
    toast('新配对码：<b>'+np.code.toUpperCase()+'</b>　手机端要改成同一个',{type:'ok',duration:6000});
    return;
  }
  if(a==='push:sendForm'){ensurePushLib();openModal(pushSendForm());return;}
  if(a==='push:send'){doPushSend();return;}
  if(a==='push:test'){doPushTest();return;}

  /* 教室大屏通知 */
  if(a==='notice:add'){openModal(noticeForm());return;}
  if(a==='notice:edit'){const _n=(S.notices||[]).find(x=>x.id===arg);if(_n)openModal(noticeForm(_n));return;}
  if(a==='notice:save'){
    if(!$('#nt_t'))return;
    const title=$('#nt_t').value.trim();
    if(!title){toast('通知标题必填',{type:'bad'});return;}
    const obj={title:title,body:$('#nt_b').value.trim(),level:$('#nt_l').value,start:$('#nt_s').value,end:$('#nt_e').value,pin:$('#nt_p').checked};
    if(arg){const n=S.notices.find(x=>x.id===arg);if(!n)return;Object.assign(n,obj);save();closeModal();render();toast('已保存通知',{type:'ok'});}
    else{S.notices.push(Object.assign({id:uid(),on:true,createdAt:new Date().toISOString()},obj));save();render();openModal(noticeForm());toast('已添加通知，可继续写下一条',{type:'ok'});setTimeout(()=>{const t=$('#nt_t');if(t)t.focus();},30);}
    return;
  }
  if(a==='notice:toggle'){const n=S.notices.find(x=>x.id===arg);if(!n)return;n.on=!n.on;save();render();toast(n.on?'已启用上屏':'已停用（大屏不再显示）',{type:'ok'});return;}
  if(a==='notice:pin'){const n=S.notices.find(x=>x.id===arg);if(!n)return;n.pin=!n.pin;save();render();return;}
  if(a==='notice:del'){const i=S.notices.findIndex(x=>x.id===arg);if(i<0)return;const item=S.notices[i];delWithUndo(()=>{S.notices.splice(i,1);},()=>{S.notices.splice(Math.min(i,S.notices.length),0,item);},'已删除通知：'+esc(item.title));return;}
  if(a==='notice:view'){boardFilter=arg;render();return;}
  if(a==='board:settings'){openModal(boardSettingsForm());return;}
  if(a==='board:saveSettings'){
    if(!$('#bs_iv'))return;
    S.board={
      interval:Math.max(3,Math.min(180,parseInt($('#bs_iv').value,10)||12)),
      scale:Math.max(60,Math.min(200,parseInt($('#bs_sc').value,10)||100)),
      marquee:$('#bs_mq').value.trim(),
      showSchedule:$('#bs_sch').checked?1:0,
      showTodos:$('#bs_td').checked?1:0,
      showAttend:$('#bs_at').checked?1:0
    };
    save();closeModal();render();toast('大屏设置已保存，下次投屏生效',{type:'ok'});return;
  }
  if(a==='board:cast'){openBoardWindow();return;}
  if(a==='board:fs'){openBoardFs();return;}
  if(a==='guide:copyBoard'){copyText(guideUrls().board,'已复制教室专用网址 —— 粘到希沃浏览器打开后收藏');return;}
  if(a==='guide:copyBoardFull'){copyText(guideUrls().boardFull,'已复制（网址里含口令，不要发给别人）');return;}
  if(a==='guide:copySend'){copyText(guideUrls().send,'已复制手机发送网址 —— 手机上打开后可添加到主屏幕');return;}
  if(a==='guide:copyBase'){copyText(guideUrls().base,'已复制工作台网址');return;}


  /* students */
  if(a==='addStudent'){openModal(studentForm());return;}
  if(a==='editStudent'){const s=S.students.find(x=>x.id===arg);openModal(studentForm(s));return;}
  if(a==='delStudent'){const i=S.students.findIndex(x=>x.id===arg);if(i<0)return;const item=S.students[i];delWithUndo(()=>{S.students.splice(i,1);},()=>{S.students.splice(Math.min(i,S.students.length),0,item);},'已删除学生：'+esc(item.name));return;}
  if(a==='addParent'){const box=$('#pbox');const i=box.children.length;const d=document.createElement('div');d.className='row';d.innerHTML=`<div class="field"><label>关系</label><input data-p="relation" value=""></div><div class="field"><label>姓名</label><input data-p="name" value=""></div><div class="field"><label>电话</label><input data-p="phone" value=""></div><div class="field"><label>微信</label><input data-p="wechat" value=""></div><button class="btn sm" data-act="delParent" data-arg="${i}">×</button>`;box.appendChild(d);return;}
  if(a==='delParent'){const box=$('#pbox');if(box.children.length>1)box.children[+arg].remove();return;}
  if(a==='saveStudent'){
    const g=id=>$('#'+id).value.trim();
    const parents=[...$('#pbox').children].map(r=>({relation:r.querySelector('[data-p=relation]').value.trim(),name:r.querySelector('[data-p=name]').value.trim(),phone:r.querySelector('[data-p=phone]').value.trim(),wechat:r.querySelector('[data-p=wechat]').value.trim()})).filter(p=>p.name||p.phone);
    const obj={name:g('f_name'),gender:g('f_gender'),studentNo:g('f_no'),seat:g('f_seat'),birthday:g('f_birth'),roles:g('f_roles')?g('f_roles').split(/[,，]/).map(x=>x.trim()).filter(Boolean):[],tags:g('f_tags')?g('f_tags').split(/[,，]/).map(x=>x.trim()).filter(Boolean):[],parents,note:g('f_note')};
    if(!obj.name){toast('姓名必填',{type:'bad'});return;}
    if(arg){Object.assign(S.students.find(x=>x.id===arg),obj);save();closeModal();render();toast('已保存修改',{type:'ok'});}
    else{S.students.push({id:uid(),...obj});save();render();openModal(studentForm());toast('已添加 '+obj.name+'，可继续录入下一位',{type:'ok'});setTimeout(()=>{const n=$('#f_name');if(n)n.focus();},30);}
    return;
  }
  if(a==='importStudents'){_stu=null;openModal(`<h3>批量导入学生</h3><p class="muted">支持 Excel(.xlsx/.xls) 与 CSV 直接导入，也可粘贴文本。</p><div class="seg" id="stuTabs" style="width:100%;margin-bottom:12px"><button data-tab="file" class="on" style="flex:1;text-align:center">从文件导入</button><button data-tab="text" style="flex:1;text-align:center">粘贴文本</button></div><div id="stuTabFile"><div class="tpl-box"><div class="tpl-head"><span>下载一份空模板，照着列名填好后导入：</span><button class="btn sm" data-act="dlStuTpl">下载模板 CSV</button></div><p class="muted" style="margin-top:7px">表头会被自动识别；职务、标签多个值用顿号或逗号分隔；班级活动可填“C6”这类标识。</p></div><hr style="margin:14px 0"><div class="field"><label>选择 Excel / CSV 文件</label><input type="file" id="stuFile" accept=".xlsx,.xls,.csv"></div><div id="stuMapArea"></div></div><div id="stuTabText" style="display:none"><p class="muted">每行一个学生，支持格式：<br><code>姓名</code> 或 <code>姓名,学号</code> 或 <code>姓名,学号,性别</code><br>用回车换行分隔。</p><textarea id="imp" placeholder="张三&#10;李四,2023002,女"></textarea><div class="flex spread" style="margin-top:8px"><button class="btn primary" data-act="doImport">导入文本</button></div></div><div class="flex spread" style="margin-top:14px"><button class="btn" data-act="close">取消</button></div>`,'tall');
    const tabs=document.querySelectorAll('#stuTabs button');
    tabs.forEach(b=>{b.onclick=()=>{tabs.forEach(x=>x.classList.remove('on'));b.classList.add('on');const t=b.dataset.tab;document.getElementById('stuTabFile').style.display=t==='file'?'block':'none';document.getElementById('stuTabText').style.display=t==='text'?'block':'none';};});
    return;}
  if(a==='dlStuTpl'){dlTemplate('学生导入模板.csv',STU_TPL);return;}
  if(a==='doImport'){const lines=$('#imp').value.split('\n').map(l=>l.trim()).filter(Boolean);let n=0;lines.forEach(l=>{const p=l.split(/[,，]/);if(p[0]){S.students.push({id:uid(),name:p[0].trim(),studentNo:(p[1]||'').trim(),gender:p[2]==='女'?'女':'男',roles:[],tags:[],parents:[]});n++;}});save();closeModal();render();toast('已导入 '+n+' 人',{type:'ok'});return;}
  if(a==='doImportExcel'){
    if(!_stu){toast('请先选择 Excel/CSV 文件',{type:'bad'});return;}
    const rows=_stu.rows, headerOn=_stu.header, dataRows=headerOn?rows.slice(1):rows, cols=rows[0]?rows[0].length:0;
    const map=[]; for(let c=0;c<cols;c++){const s=document.querySelector('.stuField[data-col="'+c+'"]'); map[c]=s?s.value:'';}
    let n=0;
    dataRows.forEach(r=>{
      const get=f=>{const c=map.indexOf(f); return c>=0?(r[c]||'').trim():'';};
      const name=get('name'); if(!name)return;
      const roles=get('roles')?get('roles').split(/[,，、]/).map(x=>x.trim()).filter(Boolean):[];
      const tags=get('tags')?get('tags').split(/[,，、]/).map(x=>x.trim()).filter(Boolean):[];
      const pn=get('parentName'),pp=get('parentPhone'),pw=get('parentWechat');
      const parents=[]; if(pn||pp||pw)parents.push({relation:'',name:pn,phone:pp,wechat:pw});
      S.students.push({id:uid(),name,gender:get('gender')==='女'?'女':'男',studentNo:get('studentNo'),seat:get('seat'),birthday:get('birthday'),roles,tags,parents,note:get('note')});
      n++;
    });
    save();_stu=null;closeModal();render();toast('已导入 '+n+' 人',{type:'ok'});return;
  }
  /* schedule */
  if(a==='openPeriodSettings'){openPeriodSettings();return;}
  if(a==='savePeriods'){savePeriods();return;}
  if(a==='addPeriod'){addPeriodRow();return;}
  if(a==='delPeriod'){const row=$('#periodRows').children[+arg];if(row)row.remove();return;}
  if(a==='movePeriod'){const[dir,idx]=arg.split('|');movePeriodRow(dir,+idx);return;}
  if(a==='resetPeriods'){if(confirm('确定恢复为默认作息时间？当前课表内容会被清空。')){S.schedule.periods=JSON.parse(JSON.stringify(DEFAULT_PERIODS));S.schedule.grid={};save();closeModal();render();}return;}
  if(a==='putCell'){const[d,pid]=arg.split('|');S.schedule.grid[d]=S.schedule.grid[d]||{};S.schedule.grid[d][pid]={subject:$('#sb_x').value.trim(),cls:$('#cls_x').value.trim(),teacher:$('#tc_x').value.trim(),tmp:$('#tmp_x').checked};save();closeModal();render();return;}
  if(a==='clearCell'){const[d,pid]=arg.split('|');S.schedule.grid[d]=S.schedule.grid[d]||{};delete S.schedule.grid[d][pid];save();closeModal();render();return;}
  if(a==='impSchedule'){_schGrid=null;openModal(`<h3>从 Excel 导入课表</h3><p class="muted">表格首行应为星期（周一、周二…），首列应为节次（第1节…）。程序按行顺序对应您“设置节次”里的顺序。支持 .xlsx/.xls/.csv。单元格可填“数学”或“数学(彭莉)”，整班活动填“C6”等。</p><div class="tpl-box"><div class="tpl-head"><span>下载一份空模板，照着行列填好后导入：</span><button class="btn sm" data-act="dlSchTpl">下载模板 CSV</button></div><p class="muted" style="margin-top:7px">首行星期（周一…周五）、首列节次（第1节…），行顺序对应“设置节次”；单元格可填“数学”“数学(彭莉)”“C6”。</p></div><hr style="margin:14px 0"><div class="field"><label>选择课表文件</label><input type="file" id="schFile" accept=".xlsx,.xls,.csv"></div><div id="schPreview" class="scrollx" style="margin-top:8px"></div><div class="flex spread" style="margin-top:10px"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="doImportSchedule">导入到课表</button></div>`,'tall');return;}
  if(a==='dlSchTpl'){dlTemplate('课表导入模板.csv',SCH_TPL);return;}
  if(a==='doImportSchedule'){ if(!_schGrid){toast('请先选择课表文件',{type:'bad'});return;} if(!confirm('将用导入的课表覆盖当前课表内容，确定？'))return; S.schedule.grid=JSON.parse(JSON.stringify(_schGrid));_schGrid=null;save();closeModal();render();toast('课表导入完成',{type:'ok'});return; }
  /* scores */
  if(a==='addExam'){openModal(`<h3>新建考试</h3><div class="row"><div class="field"><label>考试名称 *</label><input id="e_name" placeholder="如 第一次月考"></div><div class="field"><label>日期</label><input id="e_date" type="date" value="${todayStr()}"></div></div><div class="field"><label>科目(逗号分隔，含满分用 科目:满分)</label><input id="e_subs" value="语文:120,数学:120,英语:120,道法:100,历史:100,生物:100,地理:100,体育:100"></div><div class="flex spread" style="margin-top:8px"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="saveExam">创建</button></div>`);return;}
  if(a==='saveExam'){const name=$('#e_name').value.trim();if(!name){toast('请填考试名称',{type:'bad'});return;}const subs=$('#e_subs').value.split(/[,，]/).map(x=>{const[a,b]=x.split(':');return{name:a.trim(),full:+(b||100)};}).filter(x=>x.name);S.exams.push({id:uid(),name,date:$('#e_date').value||todayStr(),subjects:subs});save();render();$('#e_name').value='';$('#e_date').value=todayStr();$('#e_subs').value='语文:120,数学:120,英语:120,道法:100,历史:100,生物:100,地理:100,体育:100';$('#e_name').focus();toast('已创建「'+name+'」，可继续新建',{type:'ok'});return;}
  if(a==='delExam'){const i=S.exams.findIndex(e=>e.id===arg);if(i<0)return;const item=S.exams[i];const sc=JSON.parse(JSON.stringify(S.scores[arg]||{}));delWithUndo(()=>{delete S.scores[arg];S.exams.splice(i,1);if(curExamId===arg)curExamId=null;},()=>{S.exams.splice(Math.min(i,S.exams.length),0,item);S.scores[arg]=sc;},'已删除考试：'+esc(item.name));return;}
  if(a==='showExam'){curExamId=arg;render();return;}
  if(a==='editScores'){openScoreModal(arg);return;}
  if(a==='saveScores'){const eid=arg;const exam=S.exams.find(e=>e.id===eid);const map={};S.students.forEach(s=>{const row={};exam.subjects.forEach(sub=>{const v=$('#sc_'+s.id+'_'+sub.name).value.trim();if(v!=='')row[sub.name]=+v;});if(Object.keys(row).length)map[s.id]=row;});S.scores[eid]=map;save();closeModal();render();return;}
  if(a==='impScores'){const eid=arg;openModal(`<h3>粘贴导入成绩</h3><p class="muted">第一行科目顺序需与考试一致，首列学生姓名。<br>例：<br>姓名,语文,数学,英语<br>张三,95,88,90</p><textarea id="impsc" placeholder="姓名,语文,数学,..."></textarea><div class="flex spread" style="margin-top:8px"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="doImpScores" data-arg="${eid}">导入</button></div>`);return;}
  if(a==='doImpScores'){const eid=arg;const exam=S.exams.find(e=>e.id===eid);const lines=$('#impsc').value.trim().split('\n');if(lines.length<2){toast('至少两行',{type:'bad'});return;}const head=lines[0].split(/[,，]/).map(x=>x.trim());const subs=head.slice(1);const map={};lines.slice(1).forEach(l=>{const c=l.split(/[,，]/);const nm=c[0].trim();const st=S.students.find(s=>s.name===nm);if(!st)return;const row={};subs.forEach((sub,i)=>{const v=c[i+1];if(v!==''&&v!=null)row[sub]=+v;});if(Object.keys(row).length)map[st.id]=row;});S.scores[eid]=map;save();closeModal();render();toast('已导入 '+Object.keys(map).length+' 人',{type:'ok'});return;}
  if(a==='expScores'){exportScores(arg);return;}
  /* attend */
  if(a==='markAttend'){const d=$('#adate').value||todayStr();openAttendModal(d);return;}

/* ============ 课表 ============ */
function v_schedule(){
  const sc=S.schedule;const days=sc.days;const periods=sc.periods;
  // 课表网格：左侧列宽根据最长节次名称自适应
  const firstCol=Math.max(70,Math.min(150,24+Math.max(...periods.map(p=>(p.name+p.time).length))*7));
  let gridHtml=`<div class="sched" style="grid-template-columns:${firstCol}px repeat(${days.length},minmax(90px,1fr))">`;
  gridHtml+='<div class="cell head"></div>'+days.map(d=>`<div class="cell head">${d}</div>`).join('');
  periods.forEach((per,idx)=>{
    gridHtml+=`<div class="cell head" style="text-align:left"><div class="sb">${esc(per.name)}</div><div class="tc" style="font-size:11px;color:var(--muted);font-weight:400">${esc(per.time||'')}</div></div>`;
    days.forEach(d=>{const c=(sc.grid[d]&&sc.grid[d][per.id])||{};
      gridHtml+=`<div class="cell ${c.tmp?'tmp':''}" title="点击编辑" data-d="${d}" data-pid="${per.id}">
        <div class="sb">${esc(c.subject||'')}</div>${c.cls?`<div class="cl">${esc(c.cls)}</div>`:''}<div class="tc">${esc(c.teacher||'')}</div></div>`;});
  });
  gridHtml+='</div>';
  // 课时汇总：只统计真实上课节次（非课间操/眼保健操/用餐/午休等活动）
  const hours={};
  const classPeriods=periods.filter(p=>/^第\d+节$/.test(p.name)).map(p=>p.id);
  days.forEach(d=>{classPeriods.forEach(pid=>{const c=(sc.grid[d]&&sc.grid[d][pid]);if(c&&c.subject)hours[c.subject]=(hours[c.subject]||0)+1;});});
  const sum=Object.keys(hours).map(k=>`<span class="tag">${esc(k)} ${hours[k]}节</span>`).join('')||'<span class="muted">未排课</span>';
  return `<div class="topbar"><div><h1>课程表</h1><div class="sub">${esc(S.className)} · 点击格子编辑 · 共 ${periods.length} 个时段</div></div>
    <div class="btns"><button class="btn" data-act="openPeriodSettings">设置节次</button><button class="btn" data-act="impSchedule">从 Excel 导入</button></div></div>
   <div class="card scrollx">${gridHtml}</div>
   <div class="card"><h2>课时汇总</h2><div class="kv">${sum}</div>
     <p class="muted" style="margin-top:10px">提示：橙色格子为临时调课标记，编辑时在弹窗中勾选“临时调课”。课时汇总仅统计“第N节”类型的上课节次。</p></div>`;
}

function openPeriodSettings(){
  const rows=S.schedule.periods.map((p,i)=>periodRowHtml(p,i,S.schedule.periods.length)).join('');
  openModal(`<h3>节次设置</h3>
    <p class="muted">可自定义每个时段的名称和起止时间，调整上下顺序。课表内容按“id”关联，删除或重排序会同步移动课程。</p>
    <div id="periodRows">${rows}</div>
    <div class="btns" style="margin-top:10px"><button class="btn" data-act="addPeriod">+ 添加时段</button><button class="btn" data-act="resetPeriods">恢复默认作息</button></div>
    <div class="flex spread" style="margin-top:12px"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="savePeriods">保存</button></div>`);
}
function periodRowHtml(p,i,total){
  return `<div class="row period-row" style="align-items:flex-end;padding:6px 0;border-bottom:1px solid var(--line)" data-oid="${p.id}">
    <div class="field" style="flex:0 0 50px"><label>序号</label><input value="${i+1}" disabled style="background:var(--bg)"></div>
    <div class="field" style="flex:1"><label>名称 *</label><input data-f="name" value="${esc(p.name||'')}" placeholder="如 第1节 / 午休"></div>
    <div class="field" style="flex:1"><label>时段</label><input data-f="time" value="${esc(p.time||'')}" placeholder="如 8:00-8:40"></div>
    <div class="btns" style="padding-bottom:2px">
      <button class="btn sm" ${i===0?'disabled':''} data-act="movePeriod" data-arg="up|${i}">↑</button>
      <button class="btn sm" ${i===total-1?'disabled':''} data-act="movePeriod" data-arg="down|${i}">↓</button>
      <button class="btn sm danger" data-act="delPeriod" data-arg="${i}">删</button>
    </div>
  </div>`;
}
function addPeriodRow(){
  const box=$('#periodRows');const i=box.children.length;
  const div=document.createElement('div');div.className='row period-row';div.style.cssText='align-items:flex-end;padding:6px 0;border-bottom:1px solid var(--line)';
  div.innerHTML=`<div class="field" style="flex:0 0 50px"><label>序号</label><input value="${i+1}" disabled style="background:var(--bg)"></div>
    <div class="field" style="flex:1"><label>名称 *</label><input data-f="name" value="" placeholder="如 自由活动"></div>
    <div class="field" style="flex:1"><label>时段</label><input data-f="time" value="" placeholder="如 16:00-16:30"></div>
    <div class="btns" style="padding-bottom:2px"><button class="btn sm" disabled>↑</button><button class="btn sm" disabled>↓</button><button class="btn sm danger" data-act="delPeriod" data-arg="${i}">删</button></div>`;
  box.appendChild(div);bind();
  // 重新渲染箭头状态
  refreshPeriodArrows();
}
function movePeriodRow(dir,idx){
  const box=$('#periodRows');const rows=[...box.children];
  if(dir==='up'&&idx>0){box.insertBefore(rows[idx],rows[idx-1]);}
  else if(dir==='down'&&idx<rows.length-1){box.insertBefore(rows[idx+1],rows[idx]);}
  refreshPeriodArrows();
}
function refreshPeriodArrows(){
  const box=$('#periodRows');if(!box)return;const rows=[...box.children];
  rows.forEach((r,i)=>{
    r.querySelector('input[disabled]').value=i+1;
    const del=r.querySelector('[data-act="delPeriod"]');if(del)del.dataset.arg=i;
    r.querySelectorAll('[data-act="movePeriod"]').forEach(b=>{
      const dir=b.dataset.arg.split('|')[0];
      const disabled=(dir==='up'&&i===0)||(dir==='down'&&i===rows.length-1);
      b.disabled=disabled;
      b.dataset.arg=dir+'|'+i;
    });
  });
}
function savePeriods(){
  const box=$('#periodRows');const rows=[...box.children];
  const newPeriods=[];const idMap={};
  rows.forEach((r,i)=>{
    const name=r.querySelector('[data-f="name"]').value.trim();
    const time=r.querySelector('[data-f="time"]').value.trim();
    if(!name)return;
    const oldId=r.dataset.oid;
    const newId='p'+(i+1);
    newPeriods.push({id:newId,name,time});
    if(oldId&&oldId!==newId)idMap[oldId]=newId;
  });
  if(newPeriods.length<4){toast('至少需要保留 4 个时段',{type:'bad'});return;}
  // 迁移 grid 中的旧 id
  const newGrid={};
  Object.keys(S.schedule.grid).forEach(d=>{
    newGrid[d]={};
    Object.keys(S.schedule.grid[d]).forEach(k=>{
      const target=idMap[k]||k;
      newGrid[d][target]=S.schedule.grid[d][k];
    });
  });
  S.schedule.periods=newPeriods;
  S.schedule.grid=newGrid;
  save();closeModal();render();
}

function v_scores(){
  if(!S.exams.length)return `<div class="topbar"><div><h1>成绩分析</h1><div class="sub">记录与分析每次考试成绩</div></div><div class="btns"><button class="btn primary" data-act="addExam">+ 新建考试</button></div></div><div class="card">${emptyCard('还没有考试','创建一场考试，记录学生各科分数，系统会自动生成均分、及格率、进退步等多维度分析。',{act:'addExam',label:'+ 新建考试'})}</div>`;
  const exams=[...S.exams].sort((a,b)=>a.date.localeCompare(b.date));
  const curExam=exams.find(e=>e.id===curExamId)||exams[exams.length-1];
  return `<div class="topbar"><div><h1>成绩分析</h1><div class="sub">${exams.length} 场考试 · 录入与多维度分析</div></div>
    <div class="btns"><button class="btn primary" data-act="addExam">+ 新建考试</button><button class="btn" data-act="editScores" data-arg="${curExam.id}">录入/编辑成绩</button><button class="btn" data-act="impScores" data-arg="${curExam.id}">粘贴导入</button><button class="btn" data-act="expScores" data-arg="${curExam.id}">导出Excel</button></div></div>
   <div class="card"><div class="kv" style="margin-bottom:8px">${exams.map(e=>`<a class="lnk" data-act="showExam" data-arg="${e.id}">${esc(e.name)}(${e.date})</a>`).join(' · ')}</div></div>
   ${scoreAnalysis(curExam)}`;
}
function scoreAnalysis(exam){
  const data=S.scores[exam.id]||{};const sts=S.students.filter(s=>data[s.id]);
  if(!sts.length)return `<div class="card">${emptyCard('本场考试暂无成绩','点击“录入/编辑成绩”填写学生分数，或粘贴文本快速导入。',{act:'editScores',arg:exam.id,label:'录入/编辑成绩'})}</div>`;
  let html='';
  // 各科统计
  html+='<div class="card"><h2>各科统计</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">';
  exam.subjects.forEach(sub=>{
    const vals=sts.map(s=>data[s.id][sub.name]).filter(v=>v!=null);
    if(!vals.length)return;
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length);
    const pass=vals.filter(v=>v>=sub.full*0.6).length;const good=vals.filter(v=>v>=sub.full*0.85).length;
    const max=Math.max(...vals);const min=Math.min(...vals);
    html+=`<div class="stat" style="box-shadow:none"><div class="n" style="font-size:18px">${esc(sub.name)}</div>
      <div class="muted" style="font-size:12px;margin:4px 0">均分 ${avg.toFixed(1)} · 最高 ${max} · 最低 ${min}</div>
      <div class="bar"><span class="lab">及格率</span><span class="track"><span class="fill" style="width:${pass/vals.length*100}%"></span></span><span>${(pass/vals.length*100).toFixed(0)}%</span></div>
      <div class="bar"><span class="lab">优秀率</span><span class="track"><span class="fill" style="width:${good/vals.length*100}%;background:var(--ok)"></span></span><span>${(good/vals.length*100).toFixed(0)}%</span></div></div>`;
  });
  html+='</div></div>';
  // 分数段(取总分)
  const totals=sts.map(s=>({name:s.name,total:exam.subjects.reduce((a,sub)=>a+(data[s.id][sub.name]||0),0)}));
  const full=exam.subjects.reduce((a,sub)=>a+sub.full,0);
  const bins=[['<60%',0],['60-69%',0],['70-79%',0],['80-89%',0],['90-100%',0]];
  totals.forEach(t=>{const r=t.total/full;if(r<.6)bins[0][1]++;else if(r<.7)bins[1][1]++;else if(r<.8)bins[2][1]++;else if(r<.9)bins[3][1]++;else bins[4][1]++;});
  html+=`<div class="card"><h2>总分分数段分布</h2>${bins.map(b=>`<div class="bar"><span class="lab">${b[0]}</span><span class="track"><span class="fill" style="width:${b[1]/totals.length*100}%"></span></span><span>${b[1]}人</span></div>`).join('')}</div>`;
  // 进退步(与前一场比)
  const idx=S.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)).findIndex(e=>e.id===exam.id);
  const prev=S.exams.slice().sort((a,b)=>a.date.localeCompare(b.date))[idx-1];
  if(prev&&S.scores[prev.id]){
    const pd=S.scores[prev.id];const pst=S.students.filter(s=>pd[s.id]);
    const prevTot={};pst.forEach(s=>prevTot[s.id]=prev.subjects.reduce((a,sub)=>a+(pd[s.id][sub.name]||0),0));
    const prevRank={};Object.entries(prevTot).sort((a,b)=>b[1]-a[1]).forEach((e,i)=>prevRank[e[0]]=i+1);
    const curRank={};totals.slice().sort((a,b)=>b.total-a.total).forEach((t,i)=>curRank[S.students.find(s=>s.name===t.name).id]=i+1);
    const rows=sts.map(s=>{const pid=S.students.find(x=>x.name===s.name).id;const pr=prevRank[pid],cr=curRank[pid];if(!pr)return'';const diff=pr-cr;const cls=diff>0?'ok':diff<0?'bad':'warn';const txt=diff>0?`↑${diff}`:diff<0?`↓${-diff}`:'持平';return `<tr><td>${esc(s.name)}</td><td>${totals.find(t=>t.name===s.name).total}</td><td>${pr}</td><td>${cr}</td><td><span class="pill ${cls}">${txt}</span></td></tr>`;}).join('');
    html+=`<div class="card"><h2>进退步（对比 ${esc(prev.name)}）</h2><table><thead><tr><th>学生</th><th>总分</th><th>上次名次</th><th>本次名次</th><th>变化</th></tr></thead><tbody>${rows}</tbody></table></div>`;
    // 个人曲线(总分折线)
    const examsSorted=S.exams.slice().sort((a,b)=>a.date.localeCompare(b.date));
    const series=examsSorted.filter(e=>S.scores[e.id]).map(e=>{const d=S.scores[e.id];const st=d[s.id];if(!st)return null;return{name:e.name,total:e.subjects.reduce((a,sub)=>a+(st[sub.name]||0),0),full:e.subjects.reduce((a,sub)=>a+sub.full,0)};}).filter(Boolean);
    if(series.length>1){
      const w=520,h=160,pad=28;const maxF=Math.max(...series.map(s=>s.full));const pts=series.map((s,i)=>{const x=pad+i*(w-2*pad)/(series.length-1);const y=h-pad-(s.total/maxF)*(h-2*pad);return[x,y];});
      const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
      const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#2563eb"/><text x="${p[0]}" y="${p[1]-8}" font-size="10" text-anchor="middle" fill="#475569">${series[i].total}</text>`).join('');
      const xlab=series.map((s,i)=>`<text x="${pts[i][0]}" y="${h-8}" font-size="9" text-anchor="middle" fill="#94a3b8">${esc(s.name)}</text>`).join('');
      html+=`<div class="card"><h2>${esc(s.name)} 历次总分曲线</h2><svg class="linechart" viewBox="0 0 ${w} ${h}"><path d="${path}" fill="none" stroke="#2563eb" stroke-width="2"/>${dots}${xlab}</svg></div>`;
    }
  }
  return html;
}

function pushSub(){return (window.crypto&&window.crypto.subtle)?window.crypto.subtle:null;}
function pushSalt(code){var c=pushTopic(code),u=new Uint8Array(16),i;for(i=0;i<16;i++)u[i]=((c.charCodeAt(i%c.length)||0)+i*7)&255;return u;}
async function pushKey(code,pass){
  var st=pushSub();if(!st)throw new Error('当前环境不支持加密');
  var raw=new TextEncoder().encode(String(pass||''));
  var base=await st.importKey('raw',raw,'PBKDF2',false,['deriveKey']);
  return st.deriveKey({name:'PBKDF2',salt:pushSalt(code),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function pushSeal(o,code,pass){
  var st=pushSub();if(!st)return o;
  var k=await pushKey(code,pass);
  var iv=window.crypto.getRandomValues(new Uint8Array(12));
  var data=new TextEncoder().encode(JSON.stringify(o));
  var ct=new Uint8Array(await st.encrypt({name:'AES-GCM',iv:iv},k,data));
  var all=new Uint8Array(12+ct.length);all.set(iv,0);all.set(ct,12);
  return {v:2,e:pb64e(all)};
}
async function pushUnseal(o,code,pass){
  if(!o||!o.e)return o;
  var st=pushSub();if(!st)return null;
  try{
    var k=await pushKey(code,pass);
    var all=pb64d(o.e);
    if(all.length<13)return null;
    var pt=new Uint8Array(await st.decrypt({name:'AES-GCM',iv:all.slice(0,12)},k,all.slice(12)));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){return null;}
}
async function pushSend(p,title,body,level){
  var payload={v:2,t:String(title||''),b:String(body||''),l:String(level||'normal'),ts:Date.now()};
  var out=(p.crypt&&p.key)?await pushSeal(payload,p.code,p.key):payload;
  var r=await fetch(p.server+'/'+pushTopic(p.code),{method:'POST',body:JSON.stringify(out)});
  if(!r.ok)throw new Error('发送失败 HTTP '+r.status);
  var j=null;try{j=await r.json();}catch(e){}
  return j||{ok:1};
}
async function pushFetch(srv,code,since){
  var r=await fetch(srv+'/'+pushTopic(code)+'/json?poll=1&since='+(since||0));
  if(!r.ok)throw new Error('拉取失败 HTTP '+r.status);
  var txt=await r.text(),out=[];
  String(txt).split('\\n').forEach(function(ln){ln=String(ln).trim();if(!ln)return;try{out.push(JSON.parse(ln));}catch(e){}});
  return out;
}
function pushChime(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!window.__chimeCtx)window.__chimeCtx=new AC();
    var c=window.__chimeCtx;
    if(c.state==='suspended'&&c.resume)c.resume();
    var now=c.currentTime;
    [[784,0],[1047,0.2]].forEach(function(q){
      var o=c.createOscillator(),g=c.createGain();
      o.type='sine';o.frequency.value=q[0];
      g.gain.setValueAtTime(0.0001,now+q[1]);
      g.gain.exponentialRampToValueAtTime(0.3,now+q[1]+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001,now+q[1]+0.45);
      o.connect(g);g.connect(c.destination);
      o.start(now+q[1]);o.stop(now+q[1]+0.55);
    });
  }catch(e){}
}

async function doPushSend(){
  ensurePushLib();
  if(!window.pushSend){ toast('通道组件加载失败，请刷新页面重试',{type:'bad'}); return; }
  const p=boardPush();
  if(!p.code){ toast('还没有配对码',{type:'bad'}); return; }
  const title=($('#ps_t')&&$('#ps_t').value||'').trim();
  if(!title){ toast('标题必填',{type:'bad'}); return; }
  const body=($('#ps_b')&&$('#ps_b').value||'').trim();
  const level=($('#ps_l')&&$('#ps_l').value)||'normal';
  const btn=document.querySelector('[data-act="push:send"]');
  if(btn){ btn.disabled=true; btn.textContent='发送中…'; }
  try{
    await window.pushSend(p,title,body,level);
    if($('#ps_keep')&&$('#ps_keep').checked){
      S.notices.push({id:uid(),title,body,level,start:'',end:'',pin:0,on:1,createdAt:new Date().toISOString()});
      save();
    }
    closeModal(); render();
    toast('已发到教室大屏',{type:'ok'});
  }catch(e){
    toast('发送失败：'+e.message,{type:'bad'});
    if(btn){ btn.disabled=false; btn.textContent='发送'; }
  }
}
async function doPushTest(){
  ensurePushLib();
  if(!window.pushSend){ toast('通道组件加载失败，请刷新页面重试',{type:'bad'}); return; }
  const p=boardPush();
  if(!p.code){ toast('先生成配对码再自检',{type:'bad'}); return; }
  toast('自检中…',{duration:1500});
  const t0=Date.now();
  try{
    const r=await window.pushSend(p,'[自检]','这是一条自检消息','normal');
    const id=r&&r.id;
    const msgs=await window.pushFetch(p.server,p.code,Math.floor(Date.now()/1000)-180);
    const hit=id?msgs.some(m=>m.id===id):msgs.length>0;
    toast(hit?('自检通过，往返 '+(Date.now()-t0)+' ms'):('已发出但没拉回，往返 '+(Date.now()-t0)+' ms'),{type:hit?'ok':'warn',duration:4000});
  }catch(e){
    toast('自检失败：'+e.message,{type:'bad',duration:4000});
  }
}

    var todos=(S.todos||[]).filter(function(x){return !x.done&&x.due&&x.due<=t;}).sort(function(a,b){return String(a.due||'').localeCompare(String(b.due||''));}).slice(0,8).map(function(x){return {title:x.title,due:x.due};});
    var at=(S.attend||{})[t]||{}, att=[];

      .sort(function(a,b){return ((b.pin?1:0)-(a.pin?1:0))||String(b.createdAt||'').localeCompare(String(a.createdAt||''));})

  }
  function getData(){

  var D=getData(), idx=0, timer=null;
  function curIdx(rows){

    for(var i=0;i<rows.length;i++){var seg=String(rows[i].time||'').split('-');if(seg.length===2){var a=mins(seg[0]),b=mins(seg[1]);if(a!==null&&b!==null&&now>=a&&now<b)return i;}}

  }
  function renderHead(){

    D.notices.unshift({title:o.t,body:o.b||'',level:o.l||'normal'});

    idx=0;showNotice();renderFoot();restartRotation();

  async function pushLoop(){
    try{
      var p=D.push||{};
      if(!p.on||!p.code)return;
      if(!pushSince)pushSince=Math.floor(Date.now()/1000)-600;
      var msgs=await pushFetch(p.server,p.code,pushSince);
      for(var i=0;i<msgs.length;i++){
        var m=msgs[i];
        if(!m||m.event!=='message')continue;
        if(m.time&&m.time>pushSince)pushSince=m.time;
        if(pushSeen[m.id])continue;
        pushSeen[m.id]=1;
        var obj=null;
        try{obj=JSON.parse(m.message);}catch(e){continue;}
        if(obj&&obj.e){obj=await pushUnseal(obj,p.code,p.key||'');if(!obj)decFail++;}
        if(obj&&obj.t)arrive(obj);

  }
  function refresh(){
    try{
      var nd=getData();

        D=nd;renderHead();renderPanels();renderFoot();showNotice();restartRotation();tick();
      }

  }
  function init(){
    var sc=parseInt(D.settings.scale,10)||100;

    document.title=D.className+' · 教室大屏';
    try{if(window.Notification&&Notification.permission==='default'&&(D.push||{}).on){Notification.requestPermission();}}catch(e){}
    var fb=document.getElementById('fsBtn');

      try{
        if(document.fullscreenElement){document.exitFullscreen();}
        else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen();}
      }catch(e){}
    }
    if(fb)fb.onclick=toggleFs;
    document.addEventListener('keydown',function(e){
      if(e.key==='f'||e.key==='F'){toggleFs();}
    });
    if(window.__STANDALONE__)bootStandalone(toggleFs);
  }
  function bootStandalone(toggleFs){
    var ex=document.getElementById('exitBtn');
    if(ex){
      ex.style.display='block';
      ex.onclick=function(ev){
        ev.preventDefault();
        try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen();}catch(e){}
        try{location.replace(location.pathname);}catch(e){}
        return false;
      };
    }
    var gc=document.getElementById('gateCode'), p=D.push||{};
    if(gc)gc.textContent=(p.on&&p.code)?('配对码 '+String(p.code).toUpperCase()):'';
    var gate=document.getElementById('gate');
    var passed=false;
    function wakeLock(){
      try{
        if(navigator.wakeLock&&navigator.wakeLock.request){
          navigator.wakeLock.request('screen').then(function(wl){
            if(wl&&wl.addEventListener)wl.addEventListener('release',function(){try{navigator.wakeLock.request('screen');}catch(e){}});
          }).catch(function(){});
        }
      }catch(e){}
    }
    function enter(){
      passed=true;
      var g=document.getElementById('gate'); if(g)g.style.display='none';
      try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();}catch(e){}
      wakeLock();
    }
    if(gate){
      gate.style.display='flex';
      gate.addEventListener('click',enter);
      setTimeout(function(){ if(!passed)enter(); },8000);
    }
    document.addEventListener('click',function(){ if(!document.fullscreenElement)enter(); });
    setInterval(wakeLock,60000);
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
}

function sendPage(){
  var K='wb_banzhuren_v1';
  var $=function(s){return document.querySelector(s);};
  var level='normal';
  function readAll(){try{var o=JSON.parse(localStorage.getItem(K)||'null');return (o&&typeof o==='object')?o:{};}catch(e){return {};}}
  function writeAll(o){
    ['students','notices','comms','todos','leaves','exams'].forEach(function(k){if(!Array.isArray(o[k]))o[k]=[];});
    ['scores','attend'].forEach(function(k){if(!o[k]||typeof o[k]!=='object')o[k]={};});
    if(!o.schedule||typeof o.schedule!=='object')o.schedule={periods:[],days:['周一','周二','周三','周四','周五'],grid:{}};
    if(!o.boardPush||typeof o.boardPush!=='object')o.boardPush={server:'https://ntfy.sh',code:'',key:'',crypt:1,on:0};
    try{localStorage.setItem(K,JSON.stringify(o));}catch(e){}
  }
  function getPush(){return Object.assign({server:'https://ntfy.sh',code:'',key:'',crypt:1,on:0},(readAll().boardPush)||{});}
  function msg(t,k){var el=$('#msg');if(!el)return;el.textContent=t;el.className='msg'+(k?(' '+k):'');}
  function paintPair(){
    var p=getPush(), c=$('#pcode');
    if(p.code){c.textContent=String(p.code).toUpperCase();c.className='code';$('#cfg').style.display='none';}
    else{c.textContent='未配对';c.className='code off';$('#cfg').style.display='block';}
    $('#cfg_code').value=p.code||'';
    $('#cfg_srv').value=p.server||'https://ntfy.sh';
    $('#cfg_key').value=p.key||'';
    $('#cfg_cr').value=p.crypt?'1':'0';
  }
  function paintHist(){
    var h=(readAll().sentHistory)||[];
    $('#hist').innerHTML=h.length?h.slice(0,6).map(function(x){
      return '<div>· <b>'+String(x.t).replace(/</g,'&lt;')+'</b>　<span style="color:#5D6B85">'+String(x.d)+'</span></div>';
    }).join(''):'<span style="color:#5D6B85">还没有发过。</span>';
  }
  function setLevel(v){
    level=v;
    ['normal','important','urgent'].forEach(function(k){var b=$('#lv_'+k);if(b)b.className=(k===v?'on '+k.charAt(0):'');});
  }
  async function doSend(){
    var p=getPush();
    var t=($('#t').value||'').trim();
    if(!p.code){msg('先在上面「设置」里填好配对码','bad');$('#cfg').style.display='block';return;}
    if(!t){msg('标题不能为空','bad');try{$('#t').focus();}catch(e){}return;}
    var b=($('#b').value||'').trim();
    var btn=$('#sendBtn');btn.disabled=true;btn.textContent='发送中…';msg('');
    try{
      await pushSend(p,t,b,level);
      var o=readAll();
      var d=new Date(),pad=function(n){return (n<10?'0':'')+n;};
      o.sentHistory=[{t:t,d:(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}].concat(o.sentHistory||[]).slice(0,20);
      writeAll(o);
      msg('已发出，教室大屏约 10 秒内弹出','ok');
      $('#t').value='';$('#b').value='';paintHist();
      try{if(navigator.vibrate)navigator.vibrate(30);}catch(e){}
    }catch(e){ msg('发送失败：'+(e&&e.message||e),'bad'); }
    btn.disabled=false;btn.textContent='发送到教室大屏';
  }
  function init(){
    ['normal','important','urgent'].forEach(function(k){var b=$('#lv_'+k);if(b)b.onclick=function(){setLevel(k);};});
    var tg=$('#toggleCfg');

    var sv=$('#saveCfg');

      var code=($('#cfg_code').value||'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
      if(!code){msg('请填写教室端的 8 位配对码','bad');return;}
      var srv=($('#cfg_srv').value||'').trim().replace(/\/+$/,'')||'https://ntfy.sh';
      var o=readAll();

      writeAll(o);paintPair();msg('配对已保存到本机，现在可以发送了','ok');
    };
    var sb=$('#sendBtn');if(sb)sb.onclick=doSend;
    paintPair();paintHist();setLevel('normal');
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
}

function guideUrls(){
  const base=location.origin+location.pathname;
  const p=boardPush();
  const code=p.code||'';
  const q=[];
  if(code){
    q.push('code='+encodeURIComponent(code));
    if(p.server&&p.server!=='https://ntfy.sh')q.push('srv='+encodeURIComponent(p.server));
    if(p.crypt===0)q.push('crypt=0');
  }
  const qs=q.length?('?'+q.join('&')):'';
  const full=code&&p.key?(qs?(qs+'&key='+encodeURIComponent(p.key)):('?key='+encodeURIComponent(p.key))):qs;
  return {base:base,board:base+'#/board'+qs,boardFull:base+'#/board'+full,send:base+'#/send'};
}

    toast(note||'已复制',{type:'ok'});
  }catch(e){
    openModal(`<h3>请手动复制</h3><p class="muted">浏览器不允许自动复制，手动选中下面的网址即可。</p><textarea style="width:100%;min-height:96px;font-family:var(--font-mono);font-size:12px">${esc(t)}</textarea><div class="flex spread" style="margin-top:12px"><button class="btn primary" data-act="close">知道了</button></div>`);
  }
}

/* ================== 直达路由：#/board（教室大屏）· #/send（快捷发送） ================== */
function hashInfo(){
  const h=String(location.hash||'');
  const m=/^#\/([a-z]+)(?:\?([\s\S]*))?$/i.exec(h);
  return m?{page:String(m[1]).toLowerCase(),q:new URLSearchParams(m[2]||'')}:null;
}
function applyPushQuery(q){
  const code=((q.get('code')||'')+'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!code) return false;
  const srv=((q.get('srv')||q.get('server')||'')+'').trim().replace(/\/+$/,'')||'https://ntfy.sh';
  const key=((q.get('key')||'')+'').trim();
  const crypt=(q.get('crypt')==='0')?0:1;
  const on=(q.get('recv')==='0')?0:1;
  S.boardPush={code:code,server:srv,key:key,crypt:crypt,on:on};
  return true;
}
function bootRoute(){
  const info=hashInfo();
  if(!info) return false;
  if(info.page==='board'){
    const changed=applyPushQuery(info.q);
    if(changed){migrateBoard();save();}
    injectDoc(boardDocParts({standalone:1}));
    return true;
  }
  if(info.page==='send'){
    injectDoc(sendDocParts());
    return true;
  }
  return false;
}
/* 把整份文档换成另一个页面：head/body 整体替换，脚本用真实 script 元素执行（不依赖 document.write） */
function injectDoc(parts){
  document.documentElement.removeAttribute('data-theme');
  document.body.className='';
  document.body.removeAttribute('style');
  document.head.innerHTML=parts.head;
  document.body.innerHTML=parts.body;
  const s=document.createElement('script');
  s.textContent=parts.script;
  document.body.appendChild(s);
}

function boardDocParts(opts){
  opts=opts||{};
  const json=JSON.stringify(S).replace(/</g,'\\u003c');
  return {
    head:'<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
      '<title>'+esc(S.className||'班级')+' · 教室大屏</title><style>'+BOARD_CSS+'</style>',
    body:boardMarkup(),
    script:'var __INIT__='+json+';'+(opts.standalone?'var __STANDALONE__=1;':'')+PUSH_LIB+'('+boardPage.toString()+')();'
  };
}
function boardDocHtml(opts){
  const p=boardDocParts(opts);
  return '<!DOCTYPE html><html lang="zh-CN"><head>'+p.head+'</head><body>'+p.body+'<script>'+p.script+'<\/script></body></html>';
}
function boardBlobUrl(){
  return URL.createObjectURL(new Blob([boardDocHtml()],{type:'text/html;charset=utf-8'}));
}
function openBoardWindow(){
  const url=location.origin+location.pathname+'#/board';
  const w=window.open(url,'_blank');
  if(!w){ toast('弹窗被浏览器拦截了，改用「本页全屏」',{type:'bad'}); openBoardFs(); }
  else { toast('已打开大屏窗口（网址带 #/board，可直接收藏给希沃用），拖到外接屏后按 F 全屏',{type:'ok'}); }
}
function openBoardFs(){
  const url=boardBlobUrl();
  let ov=document.getElementById('boardFsOv');
  if(ov) ov.remove();
  ov=document.createElement('div');
  ov.id='boardFsOv';
  ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#0C111C';
  ov.innerHTML='<iframe src="'+url+'" allowfullscreen style="width:100%;height:100%;border:0"></iframe>'+
    '<button id="boardFsClose" style="position:absolute;right:14px;top:12px;z-index:3;background:rgba(255,255,255,.12);color:#9FB0CC;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit">退出 (Esc)</button>';
  document.body.appendChild(ov);
  const close=()=>{ if(document.fullscreenElement){try{document.exitFullscreen();}catch(e){}} ov.remove(); document.removeEventListener('keydown',onKey); };
  function onKey(e){ if(e.key==='Escape') close(); }
  ov.querySelector('#boardFsClose').onclick=close;
  document.addEventListener('keydown',onKey);
  const fr=ov.querySelector('iframe');
  setTimeout(()=>{ try{ if(fr.requestFullscreen) fr.requestFullscreen(); }catch(e){} },400);
}


/* ============ 备份 ============ */
function exportAll(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const ts=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='班主任工作台备份-'+ts+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('已导出备份文件',{type:'ok'});
}
document.addEventListener('change',e=>{
  if(e.target.id==='impFile2'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const v=validateBackup(d);if(!v.ok){$('#impPreview').innerHTML=`<div class="warn" style="margin:0">${v.msg}</div>`;return;}_impData=d;$('#impPreview').innerHTML=backupPreview(d);}catch(err){$('#impPreview').innerHTML=`<div class="warn" style="margin:0">文件不是有效的 JSON 备份：${esc(err.message)}</div>`;}};r.readAsText(f);return;}
  if(e.target.id==='stuFile'){const f=e.target.files[0];if(!f)return;readFileAsRows(f,(err,rows)=>{ if(err){toast(err,{type:'bad'});return;} _stu={rows,header:true}; renderStuMap(); });return;}
  if(e.target.id==='schFile'){const f=e.target.files[0];if(!f)return;readFileAsRows(f,(err,rows)=>{ if(err){toast(err,{type:'bad'});return;} _schGrid=buildSchGrid(rows); renderSchPreview(); });return;}
});
$('#backupBtn').onclick=()=>act('backup');

/* 导入恢复：带预览校验的弹窗流程 */
function backupImportForm(){return `<h3>导入恢复备份</h3>
  <p class="muted">选择一个此前导出的 <b>班主任工作台备份-*.json</b> 文件。导入前会先解析并展示其中的数据概览，确认无误后再覆盖当前数据。</p>
  <div class="tpl-box" style="margin:10px 0 14px"><div class="tpl-head"><span>没有备份？可先导出当前数据：</span><button class="btn sm" data-act="expAll">导出当前备份</button></div></div>
  <div class="field"><label>选择备份 JSON 文件</label><input type="file" id="impFile2" accept="application/json,.json"></div>
  <div id="impPreview" style="margin-top:10px"></div>
  <div class="flex spread" style="margin-top:14px"><button class="btn" data-act="close">取消</button></div>`;}
function validateBackup(d){
  if(!d||typeof d!=='object'||Array.isArray(d))return {ok:false,msg:'文件内容不是有效的工作台备份。'};
  if(!Array.isArray(d.students)||!d.schedule||typeof d.schedule!=='object')return {ok:false,msg:'这不是本工作台的备份文件（缺少学生或课表数据）。'};
  return {ok:true};
}
function backupPreview(d){
  const cnt=k=>Array.isArray(d[k])?d[k].length:0;
  const rows=[['学生',cnt('students')],['考试',cnt('exams')],['成绩记录',d.scores?Object.keys(d.scores).length:0],['考勤日期',d.attend?Object.keys(d.attend).length:0],['请假',cnt('leaves')],['家校沟通',cnt('comms')],['待办',cnt('todos')],['大屏通知',cnt('notices')]];
  const cards=rows.map(([k,v])=>`<div class="kv-mini"><span>${k}</span><b>${v}</b></div>`).join('');
  return `<div class="bk-preview">
    <p class="muted">备份内容概览：</p>
    <div class="bk-grid">${cards}</div>
    <div class="warn">⚠️ 导入将 <b>覆盖当前全部数据</b>，且不可撤销。请确认这是你要恢复的备份。</div>
    <div class="flex spread" style="margin-top:12px"><button class="btn" data-act="close">取消</button><button class="btn danger" data-act="doImpBackup">确认导入覆盖</button></div>
  </div>`;
}

/* ============ 键盘快捷键 ============ */
function isTyping(el){return el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);}
function focusSearch(){cur='students';render();setTimeout(()=>{const q=$('#q');if(q){q.focus();}},30);}
document.addEventListener('keydown',e=>{
  const modalOpen=$('#modalBg').classList.contains('open');
  if(e.key==='Escape'){ if(modalOpen)closeModal(); return; }
  if(modalOpen) return;                       // 弹窗内不响应全局快捷键
  if(isTyping(e.target)){
    if(e.key==='Enter'&&e.target.id==='q'){ render(); }   // 学生搜索框回车即搜
    return;
  }
  if(e.key==='/'){ e.preventDefault(); focusSearch(); return; }   // / 聚焦搜索
  if(/^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(idx<NAV.length) nav(NAV[idx].v); }  // 1-7 切换模块
});

/* ============ 启动 ============ */
document.documentElement.setAttribute('data-theme',curTheme);
applyBg();applyGlass();
load();if(!bootRoute()){renderNav();render();}
